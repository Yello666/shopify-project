# Same app as shopify.app.toml, but no [webhooks] block.
# Use when Cloudflare Quick Tunnel fails (e.g. QUIC blocked) and you run:
#   shopify app dev --use-localhost --config localhost
# Open https://localhost:3458 (accept self-signed cert). Webhooks are not registered in this mode.

client_id = "3e209878da5f4b10514b91b689c955c5"
name = "TestApp"
application_url = "https://shop-ai.cc"
embedded = true

[build]
automatically_update_urls_on_dev = true
include_config_on_deploy = false

[webhooks]
api_version = "2026-04"

[access_scopes]
scopes = "write_metaobject_definitions,write_metaobjects,write_products"

[auth]
redirect_urls = [ "https://shop-ai.cc/auth/callback" ]

[product.metafields.app.demo_info]
type = "single_line_text_field"
name = "Demo Source Info"
description = "Tracks products created by the Shopify app template for development"

  [product.metafields.app.demo_info.access]
  admin = "merchant_read_write"

[metaobjects.app.example]
name = "Example"
description = "An example metaobject definition created by this template"

  [metaobjects.app.example.access]
  admin = "merchant_read_write"

[metaobjects.app.example.fields.title]
name = "Title"
type = "single_line_text_field"
required = true

[metaobjects.app.example.fields.description]
name = "Description"
type = "multi_line_text_field"